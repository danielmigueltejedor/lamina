to = "Lamina-notarize"

[[replace]]
from = "MacOS/DeckCraft"
to = "MacOS/Lamina"

# The Windows install policy's name is the install folder (Nodalia\Lamina) and the registry key
# (Software\Lamina) the installer and the updater share: ASCII, like the folder.
[[replace]]
from = "\"name\": \"DeckCraft\""
to = "\"name\": \"Lamina\""

[[replace]]
from = "Name=\"DeckCraft\" />"
to = "Name=\"Lamina\" />"

[[replace]]
from = "Software\\DeckCraft"
to = "Software\\Lamina"

[[replace]]
from = "DeckCraftVersion"
to = "LaminaVersion"

[[replace]]
from = "DeckCraftBuildCommit"
to = "LaminaBuildCommit"

[[replace]]
from = "DeckCraftLegacy"
to = "LaminaLegacy"

# A byte string can only hold ASCII.
[[replace]]
from = "b\"DeckCraft\".as_slice()"
# PDF writes non-ASCII info strings as UTF-16BE with a byte-order mark.
to = '[&[0xFE, 0xFF][..], &"Lámina".encode_utf16().flat_map(u16::to_be_bytes).collect::<Vec<u8>>()].concat().as_slice()'

# The name, in every casing upstream uses.
[[replace]]
from = "DeckCraft"
to = "Lámina"

[[replace]]
from = "Deckcraft"
to = "Lamina"

[[replace]]
from = "deckcraft"
to = "lamina"

[[replace]]
from = "DECKCRAFT"
to = "LAMINA"
