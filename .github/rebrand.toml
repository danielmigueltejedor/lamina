# renamed above).
[[replace]]
from = "Join the ArtCraft community on Discord"
to = "Report a problem or suggest an idea"

[[replace]]
from = "Join our community on Discord"
to = "Report a problem or suggest an idea"

[[replace]]
from = "Discord   {DISCORD}"
to = "Issues    {DISCORD}"

[[replace]]
from = "\"discord\": DISCORD"
to = "\"issues\": DISCORD"

[[replace]]
from = "{} (Discord)"
to = "{} (issues)"

# The family the app belongs to: install folders, the About box.
[[replace]]
from = "ArtCraft"
to = "Nodalia"

# Names that end up in paths, bundle folders, registry keys and identifiers: plain ASCII.
[[replace]]
from = "DeckCraft.app"
to = "Lamina.app"

[[replace]]
from = "DeckCraft.icns"
to = "Lamina.icns"

[[replace]]
from = "DeckCraft.AppDir"
to = "Lamina.AppDir"

[[replace]]
