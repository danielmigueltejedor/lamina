name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the early manifest preflight separate from the reusable workflow. The shared gate
  # sets CRAFT_FONTS_REQUIRED=1 once the fonts are checked out, so the build script enforces actual required faces.
  # Keep this pin identical to gate, freebsd.yml and the release-*.yml workflows.
  font-pin:
    runs-on: ubuntu-latest
    env:
      # Same craft-fonts commit as the release-*.yml workflows.
      CRAFT_FONTS_REF: 37827adc41fd165f9a9234ac40f94dbad353aa69
    steps:
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getnodalia/foundation # kept at vendor/craft-fonts/main
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Font pin gate
        env:
          # The only pin allowed to predate the reviewed Chinese manifest. It is a sentinel, not
          # a proposed future SHA; update it together with all three workflow pins.
          PENDING_CRAFT_FONTS_PIN: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
        run: |
          manifest="$GITHUB_WORKSPACE/craft-fonts/fonts/simplified-chinese-manifest.txt"
          if [ -f "$manifest" ]; then
            echo "craft-fonts pin carries the reviewed simplified-Chinese manifest."
          elif [ "$CRAFT_FONTS_REF" = "$PENDING_CRAFT_FONTS_PIN" ]; then
            echo "::warning title=craft-fonts pin pending::The pinned craft-fonts commit has no fonts/simplified-chinese-manifest.txt, so CJK checks may skip. Advance ci.yml, freebsd.yml and the release-*.yml workflows together to the reviewed immutable SHA before claiming shipped Chinese fonts."
          else
            echo "::error title=craft-fonts pin missing Chinese manifest::CRAFT_FONTS_REF advanced past the known pending pin ($PENDING_CRAFT_FONTS_PIN) but still has no fonts/simplified-chinese-manifest.txt. Update the pin to the reviewed commit that carries it."
            exit 1
          fi

  gate:
    needs: font-pin
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@976581262c95c0d95c0184149c0e1ba55485ccb3 # foundation main
    with:
      # Same craft-fonts commit as the release-*.yml workflows.
      fonts-repository: getnodalia/foundation
      fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      packages: >-
        libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev
        libgl1-mesa-dev

  # Every git dependency in Cargo.lock comes from getnodalia or nodalia-design.
  git-sources:
    name: git-sources
    uses: getnodalia/foundation/.github/workflows/git-sources.yml@976581262c95c0d95c0184149c0e1ba55485ccb3 # foundation main


  # Lámina's own names everywhere; upstream's arrive renamed by the weekly sync.
  names:
    name: No upstream names
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/rebrand.py check
