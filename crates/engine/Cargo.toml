[package]
name = "lamina-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lámina engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
lamina-geom = { workspace = true }
lamina-color = { workspace = true }
lamina-model = { workspace = true }
lamina-fonts = { workspace = true }
lamina-text = { workspace = true }
lamina-render = { workspace = true }
lamina-pdf = { workspace = true }
lamina-format = { workspace = true }
lamina-pptx = { workspace = true }
lamina-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
lamina-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

