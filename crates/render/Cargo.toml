[package]
name = "lamina-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lámina renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
lamina-geom = { workspace = true }
lamina-color = { workspace = true }
lamina-metafile = { workspace = true }
lamina-model = { workspace = true }
lamina-anim = { workspace = true }
lamina-fonts = { workspace = true }
lamina-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
