[package]
name = "lamina-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lámina egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
lamina-geom = { workspace = true }
lamina-color = { workspace = true }
lamina-model = { workspace = true }
lamina-fonts = { workspace = true }
lamina-text = { workspace = true }
lamina-render = { workspace = true }
lamina-anim = { workspace = true }
lamina-engine = { workspace = true }
lamina-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
craft-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
